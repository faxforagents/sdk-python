  /v1/one-time-sends/{one_time_order_id}/checkout:
    post:
      tags:
      - one-time-sends
      summary: Open the card payment of a one-time order
      description: 'Answers the hosted payment page of the order. The card is held there, not charged. A failed
        fax costs nothing. A fax that stops part way is charged the price of the pages the carrier confirms, and
        the rest of the hold is released. A second call answers the same page while it can still be paid, and a
        new one after it expired. An order whose aup_accepted is false needs {"accept_aup": true} in the body once,
        from the status token or a session: the person who pays accepts the policy, never a key.'
      operationId: create_one_time_checkout
      parameters:
      - name: one_time_order_id
        in: path
        required: true
        schema:
          type: string
          title: One Time Order Id
      - name: t
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The status token, when no header carries it.
          title: T
        description: The status token, when no header carries it.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 255
        description: 'Replay the first successful response for the same request within 24 hours. Reusing the idempotency
          header with a different request returns 409 idempotency_key_conflict. Responses include Idempotent-Replayed:
          true on replay.'
      - name: X-FFA-Order-Token
        in: header
        required: false
        schema:
          type: string
        description: The status token of the order, for a caller without a key or a session.
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeCheckout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The order is already paid (already_paid), or it ended (order_closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                accept_aup:
                  default: false
                  description: 'True: the person who pays accepts the acceptable use policy and the terms. Needed
                    once, for an order whose aup_accepted is false, and taken only from the status token or a session.'
                  title: Accept Aup
                  type: boolean
              title: OneTimeCheckoutRequest
              type: object
      security:
      - bearerAuth: []
      - apiKeyHeader: []
      - orderToken: []
      x-required-scope: fax:send
      x-llm:
        scope: fax:send
        mutating: true
        idempotency_key: true
        agent_key_allowed: true
        hint: The card is held on the hosted page. A failed fax costs nothing, and a fax that stops part way costs
          the price of the pages the carrier confirms. A person pays, never the agent.
        order_token: true
  /v1/one-time-sends/{one_time_order_id}/confirm:
    post:
      tags:
      - one-time-sends
      summary: 'Confirm a one-time order with the token of the mailed link: the fax is released'
      description: |-
        Proves the sender's address and releases the fax. In a browser without a session it also signs the payer in and sets the session cookies. Idempotency-Key is accepted but ignored: the link works once. A repeat by the same signed-in person answers the confirmed order again. Any other repeat answers 409 link_used and sends nothing.

        No API key is needed.
      operationId: confirm_one_time_order
      parameters:
      - name: one_time_order_id
        in: path
        required: true
        schema:
          type: string
          title: One Time Order Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneTimeConfirm'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeConfirmed'
        '404':
          description: The confirmation link is not valid for this order (link_invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The link was already used (link_used), expired (link_expired), or the browser is signed in
            as someone else (link_other_session).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      x-llm:
        scope: none
        mutating: true
        idempotency_key: false
        agent_key_allowed: true
        hint: The token comes from the mailed link and works once. This releases the fax.
  /v1/one-time-sends/{one_time_order_id}/resend-confirmation:
    post:
      tags:
      - one-time-sends
      summary: Mail the confirmation link of a one-time order again
      description: At most three times per order and once in ten minutes. The earlier links keep working.
      operationId: resend_one_time_confirmation
      parameters:
      - name: one_time_order_id
        in: path
        required: true
        schema:
          type: string
          title: One Time Order Id
      - name: t
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The status token, when no header carries it.
          title: T
        description: The status token, when no header carries it.
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 255
        description: 'Replay the first successful response for the same request within 24 hours. Reusing the idempotency
          header with a different request returns 409 idempotency_key_conflict. Responses include Idempotent-Replayed:
          true on replay.'
      - name: X-FFA-Order-Token
        in: header
        required: false
        schema:
          type: string
        description: The status token of the order, for a caller without a key or a session.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The order is not waiting for its confirmation (order_closed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - bearerAuth: []
      - apiKeyHeader: []
      - orderToken: []
      x-required-scope: fax:send
      x-llm:
        scope: fax:send
        mutating: true
        idempotency_key: true
        agent_key_allowed: true
        hint: At most three times per order and once in ten minutes.
        order_token: true
