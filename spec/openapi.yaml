  /v1/one-time-sends:
    post:
      tags:
      - one-time-sends
      summary: 'Create a one-time order: one document to one fax number, priced from the card'
      description: No credential is needed. The answer carries the price, the page count and the status token. The
        next step is the checkout. A live key with fax:send or a signed-in session may create an order for its organization.
        Nothing is charged and nothing is sent by this call.
      operationId: create_one_time_order
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneTimeOrderCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A key was sent and lacks fax:send (scope_missing), or the destination is blocked (blocked_destination).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 'The form was refused (invalid_request), the number is not a fax destination (invalid_destination),
            the route is not sold one fax at a time (unsupported_destination), or the document is too large (document_too_large).
            A test key is refused: an order is live.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Rate limit reached (rate_limited). details.cap names the limit: email, destination or address
            for a daily limit of the one-time send, upload_queue when too many files are being read at once. Retry
            after the seconds in Retry-After.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 255
        description: 'Replay the first successful response for the same request within 24 hours. Reusing the idempotency
          header with a different request returns 409 idempotency_key_conflict. Responses include Idempotent-Replayed:
          true on replay.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              description: |-
                The JSON form of an order: text only. A file (PDF, PNG, JPEG, TIFF) goes as ``multipart/form-data``
                with the same field names and the part ``file``.
              properties:
                email:
                  anyOf:
                  - maxLength: 254
                    type: string
                  - type: 'null'
                  description: Where the confirmation link, the receipt and the evidence go. Required without a
                    credential; a signed-in session uses its own address; a key may leave it out to use the organization's.
                  title: Email
                sender_name:
                  description: Printed on the cover sheet. 2 to 120 characters.
                  maxLength: 200
                  title: Sender Name
                  type: string
                to:
                  description: The destination fax number, E.164.
                  maxLength: 40
                  title: To
                  type: string
                accept_aup:
                  description: 'True: the sender accepts the acceptable use policy and the terms the config route
                    names.'
                  title: Accept Aup
                  type: boolean
                to_name:
                  anyOf:
                  - maxLength: 120
                    type: string
                  - type: 'null'
                  title: To Name
                subject:
                  anyOf:
                  - maxLength: 200
                    type: string
                  - type: 'null'
                  title: Subject
                message:
                  anyOf:
                  - maxLength: 2000
                    type: string
                  - type: 'null'
                  title: Message
                text:
                  description: The document as plain text or Markdown.
                  title: Text
                  type: string
                text_format:
                  default: text
                  enum:
                  - text
                  - markdown
                  title: Text Format
                  type: string
                delete_after_send:
                  default: false
                  description: 'Delete the document and the transmitted copy the moment the fax ends in delivered,
                    partial or failed. The order, the receipt and the carrier evidence stay; they hold no document
                    content. A fax that ends unknown keeps the document until the carrier reports, or until the
                    retention period ends. Default: keep the document for the retention period.'
                  title: Delete After Send
                  type: boolean
                source_ref:
                  anyOf:
                  - maxLength: 32
                    type: string
                  - type: 'null'
                  description: Where the sender came from (a short tag, never a URL).
                  title: Source Ref
                file:
                  type: string
                  format: binary
                  description: 'The document: PDF, PNG, JPEG or TIFF. Send this or text, not both.'
              required:
              - sender_name
              - to
              - accept_aup
              type: object
          application/json:
            schema:
              additionalProperties: false
              description: |-
                The JSON form of an order: text only. A file (PDF, PNG, JPEG, TIFF) goes as ``multipart/form-data``
                with the same field names and the part ``file``.
              properties:
                email:
                  anyOf:
                  - maxLength: 254
                    type: string
                  - type: 'null'
                  description: Where the confirmation link, the receipt and the evidence go. Required without a
                    credential; a signed-in session uses its own address; a key may leave it out to use the organization's.
                  title: Email
                sender_name:
                  description: Printed on the cover sheet. 2 to 120 characters.
                  maxLength: 200
                  title: Sender Name
                  type: string
                to:
                  description: The destination fax number, E.164.
                  maxLength: 40
                  title: To
                  type: string
                accept_aup:
                  description: 'True: the sender accepts the acceptable use policy and the terms the config route
                    names.'
                  title: Accept Aup
                  type: boolean
                to_name:
                  anyOf:
                  - maxLength: 120
                    type: string
                  - type: 'null'
                  title: To Name
                subject:
                  anyOf:
                  - maxLength: 200
                    type: string
                  - type: 'null'
                  title: Subject
                message:
                  anyOf:
                  - maxLength: 2000
                    type: string
                  - type: 'null'
                  title: Message
                text:
                  description: The document as plain text or Markdown.
                  title: Text
                  type: string
                text_format:
                  default: text
                  enum:
                  - text
                  - markdown
                  title: Text Format
                  type: string
                delete_after_send:
                  default: false
                  description: 'Delete the document and the transmitted copy the moment the fax ends in delivered,
                    partial or failed. The order, the receipt and the carrier evidence stay; they hold no document
                    content. A fax that ends unknown keeps the document until the carrier reports, or until the
                    retention period ends. Default: keep the document for the retention period.'
                  title: Delete After Send
                  type: boolean
                source_ref:
                  anyOf:
                  - maxLength: 32
                    type: string
                  - type: 'null'
                  description: Where the sender came from (a short tag, never a URL).
                  title: Source Ref
              required:
              - sender_name
              - to
              - accept_aup
              - text
              type: object
      security:
      - {}
      - bearerAuth: []
      - apiKeyHeader: []
      x-required-scope: fax:send
      x-llm:
        scope: fax:send
        mutating: true
        idempotency_key: true
        agent_key_allowed: true
        hint: 'Charges nothing and sends nothing. Keep status_token: it is answered once. Next is the checkout,
          then a person pays on checkout_url and clicks the mailed confirmation link.'
        key_optional: true
    get:
      tags:
      - one-time-sends
      summary: List the organization's one-time orders, newest first
      operationId: list_one_time_orders
      parameters:
      - name: cursor
        in: query
