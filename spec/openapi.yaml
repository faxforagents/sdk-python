  /v1/topup-sessions/{topup_session_id}/cancel:
    post:
      tags:
      - billing
      summary: Cancel an open top-up, so its hosted Checkout can no longer be paid
      description: Closes the Checkout of a manual or setup top-up that is still open and answers the session with
        status canceled. Canceling a setup payment also turns off the auto top-up that waited on it. A top-up already
        canceled or expired is answered as it is. One that was paid, declined or charged off session answers 409.
      operationId: cancel_topup_session
      parameters:
      - name: topup_session_id
        in: path
        required: true
        schema:
          type: string
          title: Topup Session Id
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 255
        description: 'Replay the first successful response for the same request within 24 hours. Reusing the idempotency
          header with a different request returns 409 idempotency_key_conflict. Responses include Idempotent-Replayed:
          true on replay.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'The credential is valid and is not allowed to do this. scope_missing puts the scope in error.details.scope.
            Other codes are agent_forbidden and approval_required. A session can also meet csrf_invalid and reauth_required.
            A test key, or a session switched to Test, gets environment_not_billable here: the test wallet is never
            funded, so billing takes live.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The top-up has no open Checkout to cancel: it was paid, declined or charged off session.
            error.code is conflict and error.details.status is the top-up''s status. error.details.reason is "paid"
            when the payment came in before the cancel. idempotency_key_conflict: the Idempotency-Key was used with
            a different request, or that request is still being processed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - bearerAuth: []
      - apiKeyHeader: []
