components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer ffa_live_...` or `ffa_test_...`. The preferred form.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: The same key in `X-API-Key`, for clients that cannot set `Authorization`.
  schemas:
    Agent:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        purpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose
        enabled:
          type: boolean
          title: Enabled
        status:
          type: string
          title: Status
        project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Project Id
        policy_ids:
          items:
            type: string
          type: array
          title: Policy Ids
        contact_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact Email
        budget_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Budget Id
        budgets:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Budgets
        keys:
          items:
            $ref: '#/components/schemas/ApiKey'
          type: array
          title: Keys
        created_by:
          type: string
          title: Created By
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        disabled_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Disabled At
      additionalProperties: true
      type: object
      required:
      - id
      - name
      - purpose
      - enabled
      - status
      - project_id
      - policy_ids
      - contact_email
      - budget_id
      - budgets
      - keys
      - created_by
      - created_at
      - updated_at
      - disabled_at
      title: Agent
    AgentActivity:
      properties:
        id:
          type: string
          title: Id
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        resource_type:
          type: string
          title: Resource Type
        resource_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resource Id
        data:
          additionalProperties: true
          type: object
          title: Data
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        created_at:
          type: string
          title: Created At
      additionalProperties: true
      type: object
      required:
      - id
      - actor
      - action
      - resource_type
      - resource_id
      - data
      - correlation_id
      - created_at
      title: AgentActivity
    AgentActivityPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentActivity'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      additionalProperties: true
      type: object
      required:
      - items
      title: AgentActivityPage
    AgentCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        purpose:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Purpose
          description: Shown to humans, never evaluated.
        policy_ids:
          items:
            type: string
          type: array
          title: Policy Ids
        contact_email:
          anyOf:
          - type: string
            maxLength: 254
          - type: 'null'
          title: Contact Email
          description: Where decided approvals are mailed.
      additionalProperties: false
      type: object
      required:
      - name
      title: AgentCreate
    AgentKeyCreate:
      properties:
        label:
          type: string
          maxLength: 120
          minLength: 1
