          - type: 'null'
          title: From
          description: A number you own; omit for the shared pool.
        cover:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cover
          description: 'Cover sheet fields: to_name, from_name, subject, message. Counts as a page.'
        quality:
          type: string
          enum:
          - standard
          - fine
          - superfine
          - ultra
          title: Quality
          description: 'Fax resolution. standard is the fax standard''s 204 by 98 dpi, fine (the default) 204 by
            196, superfine 204 by 392. ultra asks the carrier for its darkest text processing at the same superfine
            resolution and takes longer to process: measured 2026-11-09, a page sent at ultra and one at superfine
            both arrived as 1728 by 4112 pixels, 204 by 391 dpi. The price does not change. The job echoes the level.'
          default: fine
        sender_name:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Sender Name
          description: The name that identifies the sender. The carrier gets it as the caller name for its header
            line. A fax without a cover sheet prints it in one line at the top of page one. The line also gives
            the sending number and the time in UTC. Letters, digits, spaces and - _ ~ ! . + only, at most 128 characters.
            Omit to use the organization's name.
        delete_after_send:
          type: boolean
          title: Delete After Send
          description: 'Delete the document and the transmitted copy the moment the fax ends in delivered, partial
            or failed. The job, its receipt and the carrier evidence stay; they hold no document content. A fax
