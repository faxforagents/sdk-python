          - type: integer
          - type: 'null'
          title: Captured Micro
        refunded_micro:
          anyOf:
          - type: integer
          - type: 'null'
          title: Refunded Micro
          description: What was refunded to the card after the charge, in micro-units.
        document_pages:
          anyOf:
          - type: integer
          - type: 'null'
          title: Document Pages
          description: The pages of the order's document. The cover sheet is not counted.
        card:
          anyOf:
          - $ref: '#/components/schemas/OneTimeCard'
          - type: 'null'
        sender_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Name
          description: 'On a receipt: the sender''s name.'
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: 'On a receipt: the address the order was made with.'
        authorized_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorized At
          description: 'On a receipt: when the card was held.'
        settled_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Settled At
          description: 'On a receipt: when the payment provider confirmed the charge, or the release.'
        failure_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Code
          description: 'On a receipt: why the order ended unpaid.'
        price:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Price
          description: 'On a receipt: flat_micro, included_pages and extra_page_micro the amount follows from.'
      additionalProperties: true
      type: object
      required:
      - order_id
      title: OneTimeJob
      description: 'The order behind a fax job that a one-time send made: what was held on the card, what was charged.'
