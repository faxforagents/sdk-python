      title: OneTimeOrderCreated
      description: |-
        The create answer: the order plus the status token. The token reads this one order, opens its
        checkout and asks for the confirmation mail again, with no key and no session, for seven days. Send it
        as ``X-FFA-Order-Token`` (or ``?t=``). ``status_url`` is the order's page in the app with the token.
    OneTimeOrderPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/OneTimeOrder'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      additionalProperties: true
      type: object
      required:
      - items
      title: OneTimeOrderPage
    OneTimePreview:
      properties:
        state:
          type: string
          enum:
          - draft
          - sent
          - deleted
          - unavailable
          title: State
        pages:
          type: integer
          title: Pages
        cover_pages:
          type: integer
          title: Cover Pages
      additionalProperties: true
      type: object
      required:
      - state
      - pages
      - cover_pages
      title: OneTimePreview
      description: |-
        Whether the pages of an order can be looked at, and how many. ``draft``: the cover sheet as it
        will be printed and the uploaded document, before the fax is released. ``sent``: the file that went
        to the carrier, cover sheet first. ``deleted``: no copy is held any more (the sender asked for the
        deletion, the retention ended, or the order ended before a fax was made). ``unavailable``: nothing
        to show right now. Page ``n`` is ``GET /v1/one-time-sends/{id}/pages/{n}``, 1 to ``pages``.
    OneTimePrice:
      properties:
        price_version:
          type: string
          title: Price Version
        currency:
          type: string
          title: Currency
        flat_micro:
          type: integer
          title: Flat Micro
        included_pages:
          type: integer
          title: Included Pages
        extra_page_micro:
          type: integer
          title: Extra Page Micro
        cover_included:
          type: boolean
          title: Cover Included
      additionalProperties: true
      type: object
      required:
      - price_version
      - currency
      - flat_micro
      - included_pages
      - extra_page_micro
      - cover_included
      title: OneTimePrice
    OneTimeQueue:
      properties:
        queued:
          type: boolean
          title: Queued
        jobs_ahead:
          type: integer
          title: Jobs Ahead
        estimated_wait_minutes:
          type: integer
          title: Estimated Wait Minutes
        paused:
          type: boolean
          title: Paused
          description: An operator has paused sends on this route. A fax to it is kept and goes out when the route
            is resumed; no time can be estimated. A one-time order that is not sent within 48 hours of its release
            is canceled and the card is not charged.
          default: false
      additionalProperties: true
      type: object
      required:
      - queued
      - jobs_ahead
      - estimated_wait_minutes
      title: OneTimeQueue
      description: |-
        The wait for a carrier line. The field ``queued`` is true when a fax sent now, or this order's
        waiting fax, is estimated to wait over ten minutes for a line. The order is kept and sent in turn,
        never dropped. The minutes are an estimate from the number of faxes ahead and the carrier's line
        count.
