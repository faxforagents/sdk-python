      title: OneTimeOrder
      description: |-
        One order of the one-time send. ``next`` is what the caller does now: ``checkout`` (open the
        payment), ``confirm`` (the payer clicks the link in the mail), ``wait`` (nothing to do; read again) or
        ``done``. Money is integer micro-USD. ``captured_micro`` is what the card was charged, written only
        once the payment provider confirmed it. ``fax`` is the fax job once the order was released, with the
        carrier's evidence once it has any.
    OneTimeOrderCreated:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          enum:
          - draft
          - checkout_open
          - authorized
          - awaiting_confirmation
          - released
          - capturing
          - canceling
          - captured
          - released_hold
          - expired
          - refused
          - settle_failed
          title: Status
        next:
          type: string
          enum:
          - checkout
          - confirm
          - wait
          - done
          title: Next
        environment:
          type: string
          enum:
          - live
          - test
          title: Environment
        source:
          type: string
          enum:
          - web
          - api
          - mcp
          title: Source
        email:
          type: string
          title: Email
        email_verified:
          type: boolean
          title: Email Verified
        sender_name:
          type: string
          title: Sender Name
        to:
          type: string
          title: To
        route:
          type: string
          title: Route
        cover:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cover
        document_pages:
          type: integer
          title: Document Pages
        document_sha256:
          type: string
          title: Document Sha256
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        delete_after_send:
          type: boolean
          title: Delete After Send
          description: The sender asked for the document and the transmitted copy to be deleted the moment the fax
            ends in delivered, partial or failed.
          default: false
        document_deleted:
          type: boolean
          title: Document Deleted
          description: 'True once no copy of the document is held: it was deleted after the send, by the retention
            period or by its owner, or the order ended before it was released and the uploaded file was removed.
            The order, the fax and the carrier evidence stay; they hold no document content.'
          default: false
        document_expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Expires At
          description: When the retention period deletes the stored document. Null before the release and once the
            document is deleted.
        price:
          $ref: '#/components/schemas/OneTimePrice'
        amount_micro:
          type: integer
          title: Amount Micro
        captured_micro:
          type: integer
          title: Captured Micro
        refunded_micro:
          type: integer
          title: Refunded Micro
          description: What was refunded to the card after the charge, in micro-units, as the ledger holds it. Zero
            when nothing was refunded. captured_micro stays what was charged.
          default: 0
        card:
          anyOf:
          - $ref: '#/components/schemas/OneTimeCard'
          - type: 'null'
        checkout_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkout Url
        checkout_expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkout Expires At
        authorized_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorized At
        confirm_deadline_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirm Deadline At
        capture_deadline_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Capture Deadline At
        confirm_mail_sent_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Confirm Mail Sent At
        resend_allowed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Resend Allowed At
          description: When the confirmation mail may be asked for again; null when it may not.
        queue:
          anyOf:
          - $ref: '#/components/schemas/OneTimeQueue'
          - type: 'null'
          description: The wait for a carrier line while the order has not ended and its fax is not on a line yet.
            Null for an ended order, a fax that is sending, and a test order.
        released_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Released At
        settled_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Settled At
        quote_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Quote Id
        fax_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Fax Job Id
        failure_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Code
        aup_version:
          type: string
          title: Aup Version
        aup_accepted:
          type: boolean
          title: Aup Accepted
          description: Whether a person accepted the acceptable use policy and the terms for this order. False for
            an order a key created until the payer accepts on the order's page; the checkout needs it.
          default: true
        status_url:
          type: string
          title: Status Url
        warnings:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Warnings
        fax:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Fax
          description: The fax job (the FaxJob shape) once the order was released; null before.
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        status_token:
          type: string
          title: Status Token
