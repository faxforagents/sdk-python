      properties:
        label:
          type: string
          title: Label
        flat_micro:
          type: integer
          title: Flat Micro
        included_pages:
          type: integer
          title: Included Pages
        extra_page_micro:
          type: integer
          title: Extra Page Micro
        cover_included:
          type: boolean
          title: Cover Included
      additionalProperties: true
      type: object
      required:
