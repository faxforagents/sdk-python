        object ``GET /v1/auth/me`` answers (the CSRF token included).
    OneTimeCoverCheck:
      properties:
        sender_name:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Sender Name
          description: Printed in the From line.
        email:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Email
          description: Printed in the From line.
        to:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: To
          description: The destination, when one is typed.
        to_name:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: To Name
          description: The recipient's name, printed in the To line. At most 120 characters, not counting spaces
            at either end.
        subject:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Subject
          description: Printed in a Subject line when it is given. At most 200 characters, not counting spaces at
            either end.
        message:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Message
          description: The note printed under the Message heading. It has to fit on the one cover page. At most
            2,000 characters, not counting spaces at either end.
      additionalProperties: false
      type: object
      title: OneTimeCoverCheck
      description: |-
        The fields a one-time order prints on its cover sheet, as a form holds them before the order exists.
        Every field may be empty. to_name, subject and message have the create's limits, and a longer one is
        refused as the create refuses it: 422 invalid_request on cover.
    OneTimeCoverRoom:
      properties:
        fits:
          type: boolean
          title: Fits
          description: The cover with this message fits on its one page.
        message_chars:
          type: integer
          title: Message Chars
          description: The length of the message as it will be printed.
        lines_left:
          anyOf:
          - type: integer
          - type: 'null'
          title: Lines Left
          description: How many more lines of message text fit on the page. Null when the message is empty, since
            the first line also brings its heading, and when it does not fit.
        fits_chars:
          anyOf:
          - type: integer
          - type: 'null'
          title: Fits Chars
          description: 'When the message runs over: how much of its start fits with the same line breaks. Null when
            it fits, and when the page is full without any message.'
      additionalProperties: true
      type: object
      required:
      - fits
      - message_chars
      title: OneTimeCoverRoom
      description: |-
        How the message sits on the one cover page, measured as the create measures it. Nothing is stored
        and no order is made.
    OneTimeFromQuote:
      properties:
        quote_id:
          type: string
          title: Quote Id
        sender_name:
          type: string
          maxLength: 200
          title: Sender Name
          description: Printed on the cover sheet. 2 to 120 characters.
        accept_aup:
          type: boolean
          title: Accept Aup
          description: 'A session sends true: the signed-in person accepts the acceptable use policy and the terms.
            A key''s value is not recorded: the person who pays accepts on the order''s page.'
          default: false
        email:
          anyOf:
          - type: string
            maxLength: 254
          - type: 'null'
          title: Email
        approval_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Approval Id
          description: An approved, unused approval request for this quote (POST /v1/approval-requests). A key needs
            it unless a delegated policy allows the send. A session needs none.
        source_ref:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Source Ref
        delete_after_send:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Delete After Send
          description: Delete the document and the transmitted copy the moment the fax ends in delivered, partial
            or failed. The order, the receipt and the carrier evidence stay; they hold no document content. A fax
            that ends unknown keeps the document until the carrier reports, or until the retention period ends.
            Left out, the quote's own delete_after_send applies.
      additionalProperties: false
      type: object
      required:
      - quote_id
      - sender_name
      title: OneTimeFromQuote
