          - api
          - mcp
          title: Source
        email:
          type: string
          title: Email
        email_verified:
          type: boolean
          title: Email Verified
        sender_name:
          type: string
          title: Sender Name
        to:
          type: string
          title: To
        route:
          type: string
          title: Route
        cover:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cover
        document_pages:
          type: integer
          title: Document Pages
        document_sha256:
          type: string
          title: Document Sha256
        document_id:
          anyOf:
