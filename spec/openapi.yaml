            digits, spaces and - _ ~ ! . + only, at most 128 characters. Omit to show the number alone.
        delete_after_send:
          type: boolean
          title: Delete After Send
          description: 'Delete the document and the transmitted copy the moment the fax ends in delivered, partial
            or failed. The job, its receipt and the carrier evidence stay; they hold no document content. A fax
            that ends unknown keeps the document until a reconcile settles it. Default: keep the document for the
            retention period.'
          default: false
        to:
          type: string
          title: To
          description: Destination in E.164, for example +12025550123.
        from:
          anyOf:
          - type: string
          - type: 'null'
          title: From
          description: A number you own; omit for the shared pool.
        cover:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cover
          description: 'Cover sheet fields: to_name, from_name, subject, message. Counts as a page.'
