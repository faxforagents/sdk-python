        mutating: true
        idempotency_key: true
        agent_key_allowed: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer ffa_live_...` or `ffa_test_...`. The preferred form.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: The same key in `X-API-Key`, for clients that cannot set `Authorization`.
    orderToken:
      type: apiKey
      in: header
      name: X-FFA-Order-Token
      description: The status token of one one-time order, answered once by the create. It reads that order, opens
        its checkout and mails its confirmation link again, for a caller with no key. The same value is accepted
        as the query parameter `t`.
    signedUrl:
      type: apiKey
      in: query
      name: sig
      description: A short-lived signed URL the API handed out, with `exp` and `sig` in the query. Use the URL as
        it was given. No API key is sent with it.
  responses:
    Unauthorized:
      description: 'No credential, or one that was not accepted: invalid_token for an API key, unauthenticated where
        a signed-in session is needed. error.details.reason says why a key was refused.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaymentRequired:
      description: 'The prepaid balance does not cover the call: insufficient_balance.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The credential is valid and is not allowed to do this. scope_missing puts the scope in error.details.scope.
        Other codes are agent_forbidden and approval_required. A session can also meet csrf_invalid and reauth_required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 'not_found: no such resource for this credential. A resource of another organization answers
        the same.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The resource is in a state that refuses the call, or the Idempotency-Key was used with a different
        request (idempotency_key_conflict). error.code names the state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: 'The body is larger than the limit of this call: payload_too_large.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableContent:
      description: 'A field failed validation: invalid_request, with one entry per field in error.details, or a
        code that names the rule.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: rate_limited. Retry-After and the RateLimit-* headers say when to try again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Something this call depends on is not available or not set up here, for example billing_unavailable
        or provider_unavailable. error.retryable says whether to send the same call again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
