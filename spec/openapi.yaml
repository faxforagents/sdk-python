    InsufficientBalance:
      title: InsufficientBalance
      description: The error envelope of 402 insufficient_balance, with its details written out.
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - retryable
          - correlation_id
          - details
          properties:
            code:
              type: string
              const: insufficient_balance
            message:
              type: string
            retryable:
              type: boolean
            correlation_id:
              type: string
            details:
              type: object
              additionalProperties: true
              required:
              - available_micro
              - needed_micro
              properties:
                available_micro:
                  type: integer
                  description: What the wallet holds that is not on hold.
                needed_micro:
                  type: integer
                  description: What this fax holds.
                top_up_url:
                  type: string
                  description: The dashboard page where a person adds funds to the wallet. A key cannot top up.
                one_time_offer:
                  type: object
                  description: 'The card path for this exact send, present when it qualifies: the one-time product
                    is open, the key is live, the route is sold one fax at a time and the document is within the
                    page cap. Pass the quote to POST /v1/one-time-sends/from-quote. A pointer, never a promise:
                    the create runs every check again.'
                  required:
                  - amount_micro
                  - currency
                  - document_pages
                  - included_pages
                  - extra_page_micro
                  - max_document_pages
                  properties:
                    amount_micro:
                      type: integer
                      description: The one-time price of this document to this number.
                    currency:
                      type: string
                    document_pages:
                      type: integer
                    included_pages:
                      type: integer
                    extra_page_micro:
                      type: integer
                    max_document_pages:
                      type: integer
                    approval_id:
                      type:
                      - string
                      - 'null'
                      description: The approval that authorized this send. It authorizes the order of the same quote
                        too.
