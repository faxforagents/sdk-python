          description: 'Fax resolution. standard is the fax standard''s 204 by 98 dpi, fine (the default) 204 by
            196, superfine 204 by 392. ultra asks the carrier for its darkest text processing at the same superfine
            resolution and takes longer to process: measured 2026-11-09, a page sent at ultra and one at superfine
            both arrived as 1728 by 4112 pixels, 204 by 391 dpi. The price does not change. The job echoes the level.'
          default: fine
