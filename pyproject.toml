[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faxforagents"
version = "0.2.0"
description = "Python client for Fax for Agents: a fax API, a hosted MCP server and SDKs built so AI agents can send and receive faxes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fax for Agents", email = "hello@faxforagents.com" }]
keywords = ["fax", "fax-api", "ai-agents", "mcp", "agents", "api-client", "sdk", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Fax",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.22",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
faxforagents = "faxforagents.cli:main"

[project.urls]
Homepage = "https://faxforagents.com"
Documentation = "https://faxforagents.com/docs"
Repository = "https://github.com/faxforagents/sdk-python"
Issues = "https://github.com/faxforagents/sdk-python/issues"
Changelog = "https://github.com/faxforagents/sdk-python/blob/main/CHANGELOG.md"
OpenAPI = "https://github.com/faxforagents/openapi"

[tool.hatch.build.targets.wheel]
packages = ["src/faxforagents"]

[tool.hatch.build.targets.sdist]
include = ["src/faxforagents", "README.md", "LICENSE", "CHANGELOG.md", "tests", "spec", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Generated: descriptions are copied from the OpenAPI document as they are.
"src/faxforagents/models.py" = ["E501"]

[tool.ruff.format]
exclude = ["src/faxforagents/models.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls https://api.faxforagents.com with FAXFORAGENTS_API_KEY; skipped when the key is not set",
]

[tool.mypy]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
