name: publish

# Publishes to PyPI when a GitHub Release is published. Provenance:
# livetennisapi-oss/livetennisapi-python/.github/workflows/publish.yml (2026-10-28), actions pinned by SHA.
#
# PyPI Trusted Publishing (OIDC): no API token is stored anywhere. PyPI verifies this workflow's
# identity. One-time setup on PyPI (Manage project, Publishing, Add a pending publisher):
#   Owner: faxforagents   Repository: sdk-python   Workflow name: publish.yml   Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,cli]" build twine
      - name: Test before publishing
        run: pytest -q -m "not live"
      - name: Assert the tag matches the package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag ($TAG) does not match pyproject version ($PKG)"
            exit 1
          fi
          echo "tag and version agree: $PKG"
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/faxforagents
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
