name: mirror to gitlab

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    name: main and the tags land on gitlab.com/faxforagents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Push main and the tags
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          REPO: ${{ github.event.repository.name }}
        # Tags are pushed with a leading plus: GitHub is the source of truth, and a tag that was recut
        # here (deleted and created again on another commit, as v0.4.2, v0.2.4 and v0.2.6 were on
        # 2026-11-09) must move on the mirror too. Without it every later run failed on "already exists".
        run: git push "https://oauth2:${GITLAB_MIRROR_TOKEN}@gitlab.com/faxforagents/${REPO}.git" "refs/remotes/origin/main:refs/heads/main" "+refs/tags/*:refs/tags/*"
